  <div class="hero-text">
    <h1>Snorkeling in Caye Caulker</h1>
    <p class="hero-desc">Half day and full day reef trips. Small boats, beautiful marine life and local guides.</p>
    <div class="hero-actions">
      <a class="btn btn-light" href="mailto:bookings@example.com?subject=Snorkeling%20trip">Book now</a>
      <a class="btn btn-ghost" href="contact.html">Ask us a Question</a>
    </div>
  </div>

  <div class="strip">
    <ul class="cards">
      <li><button class="card" type="button" aria-current="true" data-tour="half-day-tour" data-where="Caye Caulker Marine Reserve" data-time="3 hours" data-desc="Three snorkel sites: Coral Garden, Shark and Stingray Alley and South Channel, plus tarpon and magnificent frigatebird feeding. Includes water, fruit, snorkeling equipment and the park fee.">
        <img src="images/half-day-tour-sm.jpg" alt="A snorkeler in a life vest above a school of small fish" width="640" height="480">
        <span class="card-top"><span class="card-chip snorkeling">Snorkeling</span></span>
        <span class="card-text"><strong>Half Day Tour</strong><span>3 hours, 3 snorkel sites</span></span>
      </button></li>
      <li><button class="card" type="button" data-tour="full-day-tour" data-where="Hol Chan Marine Reserve" data-time="6 hours" data-desc="Four stops: Coral Garden, Shark and Ray Alley, Hol Chan (main) and the Sunken Barge. Bonus tarpon and magnificent frigatebird feeding. Includes food, water, fruit, snorkeling equipment and the park fee.">
        <img src="images/full-day-tour-sm.jpg" alt="Colorful coral heads in sunlit water" width="640" height="480">
        <span class="card-top"><span class="card-chip snorkeling">Snorkeling</span></span>
        <span class="card-text"><strong>Full Day Tour</strong><span>6 hours, 4 stops</span></span>
      </button></li>
      <li><button class="card" type="button" data-tour="night-snorkeling" data-where="South Channel" data-time="5pm to 7pm" data-desc="Two hours in total: one hour of prep and one hour in the water. Includes water, underwater lights, snorkeling equipment and the entrance and park fees.">
        <img src="images/night-snorkeling-sm.jpg" alt="A yellow feather duster worm glowing against a dark reef" width="640" height="480">
        <span class="card-top"><span class="card-chip snorkeling">Snorkeling</span></span>
        <span class="card-text"><strong>Night Snorkeling</strong><span>2 hours with lights</span></span>
      </button></li>
      <li><button class="card" type="button" data-tour="goffs-caye-snorkeling" data-where="Goff's Caye" data-time="9am to 5pm" data-desc="See manatees, snorkel Goff's Caye, stop for lunch, then enjoy the rest of the day on the island. Includes water, snorkeling equipment, fruit, food and the park fee.">
        <img src="images/goffs-caye-snorkeling-sm.jpg" alt="A manatee and calf swimming in clear water" width="640" height="480">
        <span class="card-top"><span class="card-chip snorkeling">Snorkeling</span></span>
        <span class="card-text"><strong>Full Day Goff's Caye</strong><span>Manatees, snorkel, lunch</span></span>
      </button></li>
      <li><button class="card" type="button" data-tour="half-day-spearfishing" data-where="Caye Caulker" data-time="4 hours, 9am to 1pm" data-desc="Catch lobster, conch and fish across three stops: the company's lobster traps, a shallow reef for conch and a recreational zone for spearfishing. Fresh conch ceviche is included, along with water, fruit, spearfishing and snorkeling equipment and a private vessel. 2 to 6 guests.">
        <img src="images/half-day-spearfishing-sm.jpg" alt="A spearfisher in a wetsuit at the surface holding a speargun" width="640" height="480">
        <span class="card-top"><span class="card-chip spearfishing">Spearfishing</span></span>
        <span class="card-text"><strong>Half Day Spearfishing</strong><span>4 hours, ceviche included</span></span>
      </button></li>
      <li><button class="card" type="button" data-tour="full-day-spearfishing" data-where="Caye Caulker" data-time="7 hours, 9am to 4pm" data-desc="Catch lobster, conch and fish across three stops: the company's lobster traps, a shallow reef for conch and a recreational zone for spearfishing. Fresh conch ceviche is included, along with water, fruit, spearfishing and snorkeling equipment and a private vessel. 2 to 6 guests.">
        <img src="images/full-day-spearfishing-sm.jpg" alt="A spear aimed at a school of fish in blue water" width="640" height="480">
        <span class="card-top"><span class="card-chip spearfishing">Spearfishing</span></span>
        <span class="card-text"><strong>Full Day Spearfishing</strong><span>7 hours, ceviche included</span></span>
      </button></li>
      <li><button class="card" type="button" data-tour="secret-beach" data-where="Secret Beach" data-time="9am to 5pm" data-desc="A shaded boat with a big canopy that seats 14, with dry compartments for your things. Includes rum punch and seasonal ceviche (conch, lobster or shrimp, your pick when in season). Pickup and drop off from Belize or San Pedro, day or night, for a small fee.">
        <img src="images/secret-beach-sm.jpg" alt="Palm trees leaning over a sandy beach" width="640" height="480">
        <span class="card-top"><span class="card-chip charter">Charter</span></span>
        <span class="card-text"><strong>Secret Beach Charter</strong><span>Seats 14, rum punch</span></span>
      </button></li>
      <li><button class="card" type="button" data-tour="goffs-caye-charter" data-where="Goff's Caye" data-time="9am to 5pm" data-desc="A shaded boat with a big canopy that seats 14, with dry compartments for your things. Lobster, chicken, fish and vegetarian food options. Includes rum punch and seasonal ceviche (conch, lobster or shrimp, your pick when in season). Pickup and drop off from Belize or San Pedro, day or night, for a small fee.">
        <img src="images/goffs-caye-charter-sm.jpg" alt="A tiny green island ringed by turquoise water" width="640" height="480">
        <span class="card-top"><span class="card-chip charter">Charter</span></span>
        <span class="card-text"><strong>Goff's Caye Charter</strong><span>Seats 14, food options</span></span>
      </button></li>
      <li><button class="card" type="button" data-tour="miami-beach" data-where="Miami Beach" data-time="9am to 5pm" data-desc="A shaded boat with a big canopy that seats 14, with dry compartments for your things. Lobster, chicken, fish and vegetarian food options. Includes rum punch and seasonal ceviche (conch, lobster or shrimp, your pick when in season). Pickup and drop off from Belize or San Pedro, day or night, for a small fee.">
        <img src="images/miami-beach-sm.jpg" alt="A boat and old wooden dock on a white sand beach" width="640" height="480">
        <span class="card-top"><span class="card-chip charter">Charter</span></span>
        <span class="card-text"><strong>Miami Beach Charter</strong><span>Seats 14, food options</span></span>
      </button></li>
    </ul>
